when:
    event: [push, manual]
    branch: main

steps:
    - name: fetch-cv-artifacts
      image: python:3.13-slim
      environment:
          GITEA_PACKAGE_BASE: https://gitea.liskovec.dev/api/packages/krystof.liskovec/generic/liskovec-cv
          GITEA_PACKAGE_USER:
              from_secret: deploy_user_name
          GITEA_PACKAGE_TOKEN:
              from_secret: deploy_user_token
      commands:
          - python3 scripts/fetch_cv_artifacts.py
    - name: build-and-deploy
      image: node:26-alpine
      environment:
          CLOUDFLARE_API_TOKEN:
              from_secret: cloudflare_api_token
          CLOUDFLARE_ACCOUNT_ID:
              from_secret: cloudflare_account_id
          SITE_URL: https://liskovec.pages.dev
          CLOUDFLARE_PAGES_PROJECT: liskovec
      commands:
          - npm ci
          - npm run build
          - npx --yes wrangler pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch="$CI_COMMIT_BRANCH" --commit-hash="$CI_COMMIT_SHA" --commit-message="$CI_COMMIT_MESSAGE"
